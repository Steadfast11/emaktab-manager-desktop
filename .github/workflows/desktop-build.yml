name: Native desktop release candidates
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'JSON array of runner labels to build'
        type: string
        default: '["windows-2022", "ubuntu-22.04", "macos-15", "macos-15-intel"]'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release-lock.txt
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/emaktab-nuitka-cache
          key: native-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements-release-lock.txt') }}-${{ github.sha }}
          restore-keys: |
            native-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('requirements-release-lock.txt') }}-
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-release-lock.txt
      - name: Install full browser and Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Linux packaging tool
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf
      - name: Install full browser
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Test launcher, isolation and existing behavior
        run: python -m pytest tests -q
      - name: Check async browser inside the actual server event loop
        run: python desktop.py --self-test
      - name: Build and test actual native executable
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/emaktab-nuitka-cache
        run: python packaging/build.py
      - name: Publish only tested artifacts to this workflow
        uses: actions/upload-artifact@v4
        with:
          name: eMaktab-Manager-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/eMaktab-Manager-*.zip
            release/eMaktab-Manager-*.exe
            release/eMaktab-Manager-*.bin
            release/*.sha256
            release/build-result.json
      - name: Save compiler cache for incremental rebuilds
        if: ${{ !cancelled() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/emaktab-nuitka-cache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
