name: Website on-demand lifecycle check
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  website:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eMaktab-Manager-windows-2022
          run-id: 39988778615
          github-token: ${{ github.token }}
          path: candidate
      - name: Test actual website window closure and server shutdown
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force website | Out-Null
          Copy-Item candidate/eMaktab-Manager-Windows-AMD64.exe website/manager.exe
          Invoke-WebRequest 'https://www.sqlite.org/2026/sqlite-tools-win-x64-3540100.zip' -OutFile sqlite.zip
          if((Get-FileHash sqlite.zip -Algorithm SHA256).Hash.ToLower() -ne 'fb20997ade5583a5fbf1e36db7bc3c82c9416b3f314f16961e1572aa4e49487d'){throw 'SQLite checksum mismatch'}
          Expand-Archive sqlite.zip sqlite-tools
          Get-ChildItem sqlite-tools -Recurse -Filter sqlite3.exe | Select-Object -First 1 | Copy-Item -Destination website/sqlite3.exe
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'website-isolated-user'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:EMAKTAB_ONDEMAND_ROOT=(Resolve-Path website).Path
          $env:EMAKTAB_ONDEMAND_TEST='1'
          New-Item -ItemType Directory -Force outputs/Windows-1.0.1,work/ondemand | Out-Null
          Copy-Item website/manager.exe outputs/Windows-1.0.1/eMaktab-Manager-1.0.1-Windows-x64.exe
          Copy-Item website/sqlite3.exe work/ondemand/sqlite3.exe
          Copy-Item packaging/website-start.ps1 work/ondemand/start.ps1
          python tools/build_website_single.py
          $bundle=(Resolve-Path outputs/eMaktab-Website-Windows.cmd).Path
          & cmd.exe /d /c $bundle
          if($LASTEXITCODE -ne 0){throw 'Single-file launcher cold start failed'}
          $data=Join-Path $env:LOCALAPPDATA 'eMaktabManager'
          $vault=Join-Path $data 'vault.key'
          $before=(Get-FileHash $vault -Algorithm SHA256).Hash
          $db=Join-Path $data 'manager.sqlite3'
          & website/sqlite3.exe $db 'UPDATE settings SET enabled=1 WHERE id=1;'
          & cmd.exe /d /c $bundle
          if($LASTEXITCODE -ne 0){throw 'Single-file launcher warm start failed'}
          if((Get-FileHash $vault -Algorithm SHA256).Hash -ne $before){throw 'Vault key changed'}
          $enabled=& website/sqlite3.exe $db 'SELECT enabled FROM settings WHERE id=1;'
          if($enabled.Trim() -ne '0'){throw 'Saved schedule was not disabled'}
          Write-Output 'SINGLE_FILE_COLD_WARM_SCHEDULE_DISABLED_DATA_PRESERVED_OK' 
